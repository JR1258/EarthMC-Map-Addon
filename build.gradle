plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group
base { archivesName = "${project.archives_base_name}-${project.minecraft_version}" }

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // Xaero's own Maven, for the minimap + world-map compile-only dependencies below.
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven/'
    }
    // Fallback: a Fabric Xaero JAR dropped into libs/ still resolves (e.g. offline, or a version not on the Maven).
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft        "com.mojang:minecraft:${project.minecraft_version}"
    mappings         "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: ModMenu for in-game config screen. Adjust version to match your MC version.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Compile-only: users must have Xaero's mods installed at runtime. Pulled from Xaero's Maven so no
    // manual libs/ JARs are needed (CI can build cleanly).
    modCompileOnly "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaerominimap_version}"
    modCompileOnly "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:${project.xaeroworldmap_version}"
}

// The border source JSONs live in tools/border-source and are NOT shipped: they are build inputs only.
// encodeBorders turns them into one compact binary blob (~0.9 MB vs 11.3 MB of text) that the mod reads.
def borderCountriesJson = 'tools/border-source/borders.nostra.countries.json'
def borderStatesJson    = 'tools/border-source/borders.nostra.states-and-countries.json'

// Minimum Xaero version we declare a dependency on, read from the jar in libs/ that we actually
// compile against. Pinning a number by hand drifts: a user on a Xaero too old for our mixins got a
// silently half-working mod rather than a clear "update Xaero" at launch, which cost three support
// rounds. Falls back to "*" if the jar is absent so a fresh clone still builds.
ext.xaeroFloor = { String prefix ->
    def jar = fileTree('libs').matching { include "${prefix}-*.jar" }.files.sort { it.name }.find { true }
    if (jar == null) return "*"
    def zip = new java.util.zip.ZipFile(jar)
    try {
        def entry = zip.getEntry("fabric.mod.json")
        if (entry == null) return "*"
        return ">=" + new groovy.json.JsonSlurper().parse(zip.getInputStream(entry)).version
    } finally {
        zip.close()
    }
}

processResources {
    dependsOn 'encodeBorders'
    inputs.property "version", project.version
    inputs.property "xaeroworldmap_version", xaeroFloor("xaeroworldmap-fabric")
    inputs.property "xaerominimap_version", xaeroFloor("xaerominimap-fabric")
    filteringCharset 'UTF-8'
    from(layout.buildDirectory.dir("generated/resources/borders"))
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "xaeroworldmap_version": xaeroFloor("xaeroworldmap-fabric"),
               "xaerominimap_version": xaeroFloor("xaerominimap-fabric")
    }
}

tasks.register('compileEncodeBorders', JavaCompile) {
    source = fileTree('tools') { include 'EncodeBorders.java' }
    destinationDirectory = layout.buildDirectory.dir('tools/encoder-classes')
    classpath = files()
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

tasks.register('encodeBorders', JavaExec) {
    dependsOn 'compileEncodeBorders'
    inputs.file borderCountriesJson
    inputs.file borderStatesJson
    inputs.file 'tools/EncodeBorders.java'
    outputs.dir layout.buildDirectory.dir('generated/resources/borders/assets/townymapaddon/borders')
    classpath = files(layout.buildDirectory.dir('tools/encoder-classes'))
    mainClass = 'EncodeBorders'
    doFirst {
        delete layout.buildDirectory.dir('generated/resources/borders')
    }
    args file(borderCountriesJson).absolutePath,
         file(borderStatesJson).absolutePath,
         layout.buildDirectory.dir('generated/resources/borders').get().asFile.absolutePath
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Automatically deploy the remapped JAR to the Modrinth launcher profile after build.
def modsDir = file(new File(System.getProperty("user.home"), "Library/Application Support/ModrinthApp/profiles/1.21.11/mods"))
def oldModJarPrefixes = ['towny-map-addon', 'EarthMC Map Addon', 'EarthMC.Map.Addon', 'earthmc-map-addon']
def modrinthLauncherDb = file(new File(System.getProperty("user.home"), "Library/Application Support/ModrinthApp/app.db"))

def commandResult = { List<String> args, String stdin = null ->
    def process = new ProcessBuilder(args.collect { it.toString() }).start()
    if (stdin != null) {
        process.outputStream.withWriter('UTF-8') { writer -> writer << stdin }
    } else {
        process.outputStream.close()
    }
    def output = new ByteArrayOutputStream()
    def error = new ByteArrayOutputStream()
    process.inputStream.transferTo(output)
    process.errorStream.transferTo(error)
    [exitValue: process.waitFor(), output: output.toString('UTF-8').trim()]
}

def commandOutput = { List<String> args ->
    def result = commandResult(args)
    result.exitValue == 0 ? result.output : null
}

def sqlEscape = { String value ->
    value.replace("'", "''")
}

def registerModrinthLauncherFile = { File deployedJar ->
    if (!deployedJar.isFile() || !modrinthLauncherDb.isFile()) return
    if (commandOutput(['which', 'sqlite3']) == null ||
        commandOutput(['which', 'curl']) == null ||
        commandOutput(['which', 'shasum']) == null) {
        return
    }

    def shaLine = commandOutput(['shasum', '-a', '1', deployedJar.absolutePath])
    def sha1 = shaLine?.tokenize()?.first()
    if (!sha1) return

    def requestBody = groovy.json.JsonOutput.toJson([hashes: [sha1], algorithm: 'sha1'])
    def lookup = commandResult([
            'curl', '-sS', '-X', 'POST', 'https://api.modrinth.com/v2/version_files',
            '-H', 'Content-Type: application/json',
            '--data-binary', '@-'
    ], requestBody)
    if (lookup.exitValue != 0) return

    def versions = new groovy.json.JsonSlurper().parseText(lookup.output)
    def version = versions[sha1]
    if (!version?.project_id || !version?.id) return

    def data = groovy.json.JsonOutput.toJson([
        hash: sha1,
        project_id: version.project_id,
        version_id: version.id
    ])
    def expires = ((System.currentTimeMillis() / 1000L) as long) + 60L * 60L * 24L * 30L
    def sql = "INSERT OR REPLACE INTO cache (id,data_type,alias,data,expires) VALUES ('${sqlEscape(sha1)}','file',NULL,'${sqlEscape(data)}',${expires});"
    def update = commandResult(['sqlite3', modrinthLauncherDb.absolutePath, sql])
    if (update.exitValue == 0) {
        println "Registered ${deployedJar.name} with Modrinth launcher metadata (${version.project_id}/${version.id})."
    }
}

tasks.register('deployToMods', Copy) {
    dependsOn remapJar
    from(remapJar.archiveFile)
    into(modsDir)
    // Remove any older version of this mod so there are no duplicates
    doFirst {
        modsDir.listFiles()?.each { f ->
            if (oldModJarPrefixes.any { prefix -> f.name.startsWith(prefix) }) f.delete()
        }
    }
    doLast {
        def deployedJar = new File(modsDir, remapJar.archiveFileName.get())
        println "Deployed ${remapJar.archiveFileName.get()} → ${modsDir}"
        registerModrinthLauncherFile(deployedJar)
    }
}

build.finalizedBy(deployToMods)
